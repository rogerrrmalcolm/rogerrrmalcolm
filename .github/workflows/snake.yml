name: Profile assets

on:
  schedule:
    - cron: "19 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/build_activity_tab.py"
      - "tests/test_activity_tab.py"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check activity grouping and SVG output
        run: python3 -m unittest discover -s tests -v

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6e5fcf&color_dots=#ebedf0,#d6eddc,#9fcfb1,#65ad85,#317453
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#b8a7ff&color_dots=#161b22,#244b3c,#347557,#4ba477,#78cba1

      - name: Generate guitar activity tabs
        run: python3 scripts/build_activity_tab.py --user "$PROFILE_OWNER" --out dist
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVG assets to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: "Update profile activity assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
